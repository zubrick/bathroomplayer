esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}

logger:
  level: DEBUG

captive_portal:

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: connected_to_hass
              value: 'true'
          - lvgl.widget.show: ${devicename}_hastatus
          - lvgl.widget.hide: boot_screen
          - script.execute: lvgl_restart_idle
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: connected_to_hass
              value: 'false'
          - lvgl.widget.hide: ${devicename}_hastatus

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: roboto_large
    size: 28
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: roboto_med
    size: 18
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: roboto
    size: 16
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 200
    id: roboto_small
    size: 14
  - file: "font/materialdesignicons-webfont.ttf"
    id: battery_icons_20
    size: 20
    bpp: 4
    glyphs: [
      "\U000F007A", # mdi-battery-10
      "\U000F007B", # mdi-battery-20
      "\U000F007C", # mdi-battery-30
      "\U000F007D", # mdi-battery-40
      "\U000F007E", # mdi-battery-50
      "\U000F007F", # mdi-battery-60
      "\U000F0080", # mdi-battery-70
      "\U000F0081", # mdi-battery-80
      "\U000F0082", # mdi-battery-90
      "\U000F0079", # mdi-battery (full)
      "\U000F008E", # mdi-battery-outline
      "\U000F0091", # mdi-battery-unknown
      "\U000F0084", # mdi-battery-charging
      "\U000F04B3", # nosleep
      ]
  - file: "font/materialdesignicons-webfont.ttf"
    id: media_icons_60
    size: 60
    bpp: 4
    glyphs: [
      "\U000F040A", # play
      "\U000F03E4", # pause
      "\U000F04AD", # next
      "\U000F04AE", # previous
      "\U000F075E", # vol-minus
      "\U000F075D", # vol-plus
      "\U000F0581", # vol-off
      "\U000F049D", # shuffle
      "\U000F049E", # unshuffle
      "\U000F0457", # norepeat
      "\U000F0456", # repeat
      "\U000F0458", # repeat-once
      "\U000F04B3", # nosleep
      ]

lvgl:
  touchscreens:
    touchscreen_id: touch
  on_idle:
    - timeout: 10sec
      then:
        - lvgl.page.show:
            id: overview_page
        - if:
            condition:
              and:
              - lambda: 'return id(connected_to_hass);'
            then:
              - if:
                  condition:
                    - lambda: 'return std::string(id(mpstate).state) == "playing";'
                  then:
                    - script.execute: lvgl_restart_idle
                  else:
                    - logger.log: "Dimming screen..."
                    - light.control:
                        id: lcd_backlight
                        brightness: !lambda 'return (id(lcd_backlight).current_values.get_brightness() / 2);'
    - timeout: 20sec
      then:
        - logger.log: "Turning off screen..."
        - if:
            condition:
              and:
                - lambda: 'return id(connected_to_hass);'
            then:
              - if:
                  condition:
                    - lambda: 'return std::string(id(mpstate).state) == "playing";'
                  then:
                    - script.execute: lvgl_restart_idle
                  else:
                    - light.turn_off: lcd_backlight
    - timeout: 30min
      then:
        - logger.log: "Sleep timeout triggered..."
        - logger.log: "Entering deep sleep..."
        - delay: 1s
        - wifi.disable:
        - light.turn_off: lcd_backlight
        - lvgl.pause:
  top_layer:
    widgets:
      - label:
          text: "\uF1EB"
          id: ${devicename}_hastatus
          hidden: true
          align: top_right
          x: -8
          y: 2
          text_align: right
          text_color: 0xa0a0a0
      - label:
          text: "" # start with mdi-battery-unknown
          id: battery_status
          hidden: true
          align: top_left
          x: 44
          y: 2
          text_align: left
          text_color: 0xa0a0a0
          text_font: battery_icons_20
      - label:
          text: ""
          id: battery_status_label
          align: top_left
          hidden: true
          x: 66
          y: 4
          text_color: 0xa0a0a0
          text_font: roboto_small
      - label:
          text: "\U000F04B3"
          id: lbl_nosleepicon
          hidden: true
          align: top_left
          x: 102
          y: 2
          text_align: left
          text_color: 0xa0a0a0
          text_font: battery_icons_20
      - label:
          text: " "
          id: lbl_time
          hidden: false
          align: top_left
          x: 4
          y: 4
          text_align: right
          text_color: 0xa0a0a0
          text_font: roboto_small
      - label:
          text: " "
          id: lbl_mpname
          hidden: false
          align: top_right
          x: -30
          y: 4
          text_align: right
          text_color: 0xa0a0a0
          text_font: roboto_small
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x333333
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: boot_screen_image
          on_press:
            - lvgl.widget.hide: boot_screen

  pages:
    - id: overview_page
      width: 320
      height: 240
      scrollbar_mode: "OFF"
      bg_color: 0x333333
      on_press:
        then:
          - script.execute: lvgl_restart_idle
      on_swipe_left:
        then:
          - if:
              condition:
                - light.is_on: lcd_backlight
              then:
                - lvgl.page.next:
                    animation: MOVE_LEFT
                    time: 200ms
          - script.execute: lvgl_restart_idle
      widgets:
        - obj:
            id: mediaplayer
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: 0x101010
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            on_press:
              then:
                - script.execute: lvgl_restart_idle
            widgets:
              - image:
                  id: wmpimg
                  align: CENTER
                  src: bgimg
                  image_recolor_opa: 60%
                  pad_top: -40
                  pad_bottom: -40
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
              - label:
                  align: CENTER
                  id: lbl_title
                  text_font: roboto
                  text_color: !lambda return lv_color_hex(0xFFFFFF);
                  y: -70
                  text: ""
                  long_mode: CLIP
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
              - label:
                  align: CENTER
                  id: lbl_artist
                  text_font: roboto_med
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: -35
                  text: ""
                  long_mode: CLIP
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
              - label:
                  align: CENTER
                  id: lbl_album
                  text_font: roboto
                  text_color: !lambda return lv_color_hex(0x808080);
                  y: -5
                  text: ""
                  long_mode: CLIP
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_prev
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 140
                  x: 40
                  text: "\U000F04AE"
                  on_press:
                    then:
                      - if:
                          condition:
                            - light.is_on: lcd_backlight
                          then:
                            - lvgl.label.update:
                                id: lbl_prev
                                text_color: !lambda return lv_color_hex(0x303030);
                            - homeassistant.action:
                                action: media_player.media_previous_track
                                data:
                                  entity_id: ${mediaplayer}
                            - logger.log: "Previous"
                            - delay: 500ms
                            - lvgl.label.update:
                                id: lbl_prev
                                text_color: !lambda return lv_color_hex(0xF0F0F0);
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_pp
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 140
                  x: 130
                  text: "\U000F040A"
                  on_press:
                    then:
                      - if:
                          condition:
                            - light.is_on: lcd_backlight
                          then:
                            - lvgl.label.update:
                                id: lbl_pp
                                text_color: !lambda return lv_color_hex(0x303030);
                            - homeassistant.action:
                                action: media_player.media_play_pause
                                data:
                                  entity_id: ${mediaplayer}
                            - logger.log: "PlayPause"
                            - delay: 500ms
                            - lvgl.label.update:
                                id: lbl_pp
                                text_color: !lambda return lv_color_hex(0xF0F0F0);
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_next
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 140
                  x: 220
                  text: "\U000F04AD"
                  on_press:
                    then:
                      - if:
                          condition:
                            - light.is_on: lcd_backlight
                          then:
                            - lvgl.label.update:
                                id: lbl_next
                                text_color: !lambda return lv_color_hex(0x303030);
                            - homeassistant.action:
                                action: media_player.media_next_track
                                data:
                                  entity_id: ${mediaplayer}
                            - logger.log: "Next"
                            - delay: 500ms
                            - lvgl.label.update:
                                id: lbl_next
                                text_color: !lambda return lv_color_hex(0xF0F0F0);
                      - script.execute: lvgl_restart_idle
              - bar:
                  x: 0
                  y: 230
                  id: lbl_pos
                  value: 0
                  min_value: 0
                  max_value: 100
                  width: 320
                  height: 4
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
    - id: volume_page
      width: 320
      height: 240
      scrollbar_mode: "OFF"
      bg_color: 0x333333
      on_swipe_right:
        then:
          - if:
              condition:
                - light.is_on: lcd_backlight
              then:
                - lvgl.page.previous:
                    animation: MOVE_RIGHT
                    time: 200ms
          - script.execute: lvgl_restart_idle
      widgets:
        - obj:
            id: mediaplayerctrl
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: 0x101010
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              - image:
                  id: wmpimg2
                  align: CENTER
                  src: bgimg
                  image_recolor_opa: 60%
                  pad_top: -40
                  pad_bottom: -40
                  on_press:
                    then:
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_repeat
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 40
                  x: 40
                  text: "\U000F0457"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_repeat
                          text_color: !lambda return lv_color_hex(0x303030);
                      - homeassistant.action:
                          action: media_player.repeat_set
                          data:
                            entity_id: ${mediaplayer}
                            repeat: !lambda |-
                              if (std::string(id(mprepeat).state) == "all") {
                                  return "one";
                              } else if (std::string(id(mprepeat).state) == "one") {
                                  return "off"; // repeatone
                              } else {
                                  return "all"; // norepeat
                              }
                      - logger.log: "repeat"
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_shuffle
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 40
                  x: 130
                  text: "\U000F049E"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_shuffle
                          text_color: !lambda return lv_color_hex(0x303030);
                      - homeassistant.action:
                          action: media_player.shuffle_set
                          data:
                            entity_id: ${mediaplayer}
                            shuffle: !lambda |-
                              if (id(mpshuffle).state) {
                                return "false";
                              } else {
                                return "true";
                              }
                      - logger.log: "shuffle"
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_nosleep
                  text_font: media_icons_60
                  text_color: !lambda |-
                    if (id(avoid_sleep)) {
                      return lv_color_hex(0x009ac7);
                    } else {
                      return lv_color_hex(0xF0F0F0);
                    }
                  y: 40
                  x: 220
                  text: "\U000F04B3"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_nosleep
                          text_color: !lambda return lv_color_hex(0x303030);
                      - lambda: |-
                          if (id(avoid_sleep)) {
                            id(avoid_sleep) = false;
                          } else {
                            id(avoid_sleep) = true;
                          }
                      - if:
                          condition:
                            - lambda: return id(avoid_sleep);
                          then:
                            - lvgl.widget.show: lbl_nosleepicon
                          else:
                            - lvgl.widget.hide: lbl_nosleepicon
                      - logger.log: "nosleep"
                      - delay: 500ms
                      - lvgl.label.update:
                          id: lbl_nosleep
                          text_color: !lambda |-
                            if (id(avoid_sleep)) {
                              return lv_color_hex(0x009ac7);
                            } else {
                              return lv_color_hex(0xF0F0F0);
                            }
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_volm
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 120
                  x: 40
                  text: "\U000F075E"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_volm
                          text_color: !lambda return lv_color_hex(0x303030);
                      - homeassistant.action:
                          action: media_player.volume_down
                          data:
                            entity_id: ${mediaplayer}
                      - logger.log: "vol-"
                      - delay: 500ms
                      - lvgl.label.update:
                          id: lbl_volm
                          text_color: !lambda return lv_color_hex(0xF0F0F0);
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_mute
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 120
                  x: 130
                  text: "\U000F0581"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_mute
                          text_color: !lambda return lv_color_hex(0x303030);
                      - if:
                          condition:
                            - lambda: 'return id(mpmute).state;'
                          then:
                            - homeassistant.action:
                                action: media_player.volume_mute
                                data:
                                  entity_id: ${mediaplayer}
                                  is_volume_muted: 'false'
                            - logger.log: "unmute"
                          else:
                            - homeassistant.action:
                                action: media_player.volume_mute
                                data:
                                  entity_id: ${mediaplayer}
                                  is_volume_muted: 'true'
                            - logger.log: "mute"
                      - script.execute: lvgl_restart_idle
              - label:
                  id: lbl_volp
                  text_font: media_icons_60
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
                  y: 120
                  x: 220
                  text: "\U000F075D"
                  on_press:
                    then:
                      - lvgl.label.update:
                          id: lbl_volp
                          text_color: !lambda return lv_color_hex(0x303030);
                      - homeassistant.action:
                          action: media_player.volume_up
                          data:
                            entity_id: ${mediaplayer}
                      - logger.log: "vol+"
                      - delay: 500ms
                      - lvgl.label.update:
                          id: lbl_volp
                          text_color: !lambda return lv_color_hex(0xF0F0F0);
                      - script.execute: lvgl_restart_idle
              - slider:
                  x: 20
                  y: 200
                  id: lbl_volslider
                  value: 0
                  min_value: 0
                  max_value: 100
                  width: 280
                  on_value:
                    - logger.log:
                        format: "Slider value is: %.0f"
                        args: [ 'x' ]
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          entity_id: ${mediaplayer}
                          volume_level: !lambda return x / 100.00;
                    - script.execute: lvgl_restart_idle

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    entity_category: config
    output: lcd_backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

text_sensor:
  - platform: homeassistant
    id: mpimage
    entity_id: ${mediaplayer}
    attribute: entity_picture
    on_value:
      then:
        - script.execute: lvgl_restart_idle
        - online_image.set_url:
            id: bgimg
            url: !lambda |
              return std::string("${hahost}") + x;

  - platform: homeassistant
    id: mpartist
    entity_id: ${mediaplayer}
    attribute: media_artist
    on_value:
      then:
        - script.execute: lvgl_restart_idle
        - lvgl.label.update:
            id: lbl_artist
            text: !lambda return x;
  - platform: homeassistant
    id: mptitle
    entity_id: ${mediaplayer}
    attribute: media_title
    on_value:
      then:
        - script.execute: lvgl_restart_idle
        - lvgl.label.update:
            id: lbl_title
            text: !lambda return x;
  - platform: homeassistant
    id: mpalbum
    entity_id: ${mediaplayer}
    attribute: media_album_name
    on_value:
      then:
        - script.execute: lvgl_restart_idle
        - lvgl.label.update:
            id: lbl_album
            text: !lambda return x;
  - platform: homeassistant
    id: mpstate
    entity_id: ${mediaplayer}
    on_value:
      then:
        - logger.log:
            format: "mpstate is %s"
            args: [ 'id(mpstate).state' ]
        - script.execute: lvgl_restart_idle
        - lvgl.label.update:
            id: lbl_pp
            text: !lambda |-
              static char buf[10];
              std::string icon;
              if (std::string(x) == "playing") {
                  icon = "\U000F03E4"; // pause
              } else {
                  icon = "\U000F040A"; // play
              }
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
  - platform: homeassistant
    id: mprepeat
    entity_id: ${mediaplayer}
    attribute: repeat
    on_value:
      then:
        - logger.log:
            format: "mprepeate is %s"
            args: [ 'x' ]
        - lvgl.label.update:
            id: lbl_repeat
            text: !lambda |-
              static char buf[10];
              std::string icon;
              if (std::string(x) == "all") {
                  icon = "\U000F0456"; // repeatall
              } else if (std::string(x) == "one") {
                  icon = "\U000F0458"; // repeatone
              } else {
                  icon = "\U000F0457"; // norepeat
              }
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
        - lvgl.label.update:
            id: lbl_repeat
            text_color: !lambda |-
              if (std::string(x) == "all" || std::string(x) == "one") {
                return lv_color_hex(0x009ac7);
              } else {
                return lv_color_hex(0xF0F0F0);
              }
  - platform: homeassistant
    id: mpname
    entity_id: ${mediaplayer}
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_mpname
            text: !lambda return x;

globals:
  - id: battery_is_charging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: current_brightness
    type: float
    restore_value: no
    initial_value: '0.50'
  - id: avoid_sleep
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: connected_to_hass
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: "Max Brightness"
    id: max_brightness
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 100
    step: 1.0
    initial_value: 100
    unit_of_measurement: "%"
    mode: slider
    entity_category: "config"
    on_value:
      then:
        - delay: 100ms
        - if:
            condition:
              light.is_on: lcd_backlight
            then:
              - light.control:
                  id: lcd_backlight
                  brightness: !lambda 'return x / 100.0;'

binary_sensor:
  - platform: homeassistant
    id: mpmute
    entity_id: ${mediaplayer}
    attribute: is_volume_muted
    on_state:
      then:
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: lbl_mute
                  text_color: !lambda return lv_color_hex(0x009ac7);
            else:
              - lvgl.label.update:
                  id: lbl_mute
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
        - script.execute: lvgl_restart_idle
  - platform: homeassistant
    id: mpshuffle
    entity_id: ${mediaplayer}
    attribute: shuffle
    on_state:
      then:
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: lbl_shuffle
                  text_color: !lambda return lv_color_hex(0x009ac7);
              - lvgl.label.update:
                  id: lbl_shuffle
                  text: "\U000F049D"
            else:
              - lvgl.label.update:
                  id: lbl_shuffle
                  text_color: !lambda return lv_color_hex(0xF0F0F0);
              - lvgl.label.update:
                  id: lbl_shuffle
                  text: "\U000F049E"

sensor:
  - platform: homeassistant
    id: mpvol
    entity_id: ${mediaplayer}
    attribute: volume_level
    on_value:
      then:
        - lvgl.slider.update:
            id: lbl_volslider
            value: !lambda return x * 100;
  - platform: homeassistant
    id: mppos
    entity_id: ${mediaplayer}
    attribute: media_position
    on_value:
        then:
          - lambda: |-
              if (id(mpdur).state > 0) {
                id(mpposrel).publish_state(100 * x / id(mpdur).state);
              }
          - script.execute: lvgl_restart_idle
  - platform: homeassistant
    id: mpdur
    entity_id: ${mediaplayer}
    attribute: media_duration
  - platform: template
    id: mpposrel
    on_value:
      then:
        - lvgl.bar.update:
            id: lbl_pos
            value: !lambda return x;


http_request:

online_image:
  - id: bgimg
    url: "https://raw.githubusercontent.com/zubrick/bathroomplayer/db4727f6f514d38eeb02e374865af241903b6736/bathroomplayer.jpg"
    format: JPEG
    type: rgb565
    resize: 320x320
    on_download_finished:
      - lvgl.image.update:
          id: wmpimg
          src: bgimg
      - lvgl.image.update:
          id: wmpimg2
          src: bgimg

image:
  - id: boot_screen_image
    file: "https://raw.githubusercontent.com/zubrick/bathroomplayer/db4727f6f514d38eeb02e374865af241903b6736/bathroomplayer.jpg"
    type: rgb565

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

script:
  ## WAKE UP SCREEN
  - id: wake_up_screen
    mode: restart
    then:
      - logger.log: "Running Wake Up Screen Script..."
      # ENABLE WIFI
      - if:
          condition:
            not:
              wifi.enabled
          then:
            - wifi.enable:
      - script.execute: lvgl_restart_idle
      ## LIGHTS ON
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda 'return id(current_brightness);'

  ## RESTART LVGL IDLE TIMER
  - id: lvgl_restart_idle
    mode: restart
    then:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            not:
              wifi.enabled
          then:
            - wifi.enable:
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda 'return id(current_brightness);'
      - lambda: 'lv_disp_trig_activity(NULL);' # reset LVGL idle timer
  - id: time_update
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
             return id(homeassistant_time).now().strftime("%H:%M");
  - id: middle_button_touch
    mode: restart
    then:
      - lambda: |-
          float max_b = id(max_brightness).state / 100.0;
          float step = (max_b - 0.25f) / 3.0f;
          float levels[] = {0.25f, 0.25f + step, 0.25f + 2 * step, max_b};
          float current = id(current_brightness);
          int idx = 0;
          // Find the closest level >= current, then step to next
          for (int i = 0; i < 4; i++) {
            if (current <= levels[i] + 0.01) { idx = i; break; }
          }
          idx = (idx + 1) % 4;
          id(current_brightness) = levels[idx];
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda 'return id(current_brightness);'
      - script.execute: lvgl_restart_idle
  - id: left_button_touch
    mode: restart
    then:
      - if:
          condition:
            - light.is_on: lcd_backlight
          then:
            - lvgl.page.previous:
                animation: MOVE_RIGHT
                time: 200ms
      - script.execute: lvgl_restart_idle
  - id: right_button_touch
    mode: restart
    then:
      - if:
          condition:
            - light.is_on: lcd_backlight
          then:
            - lvgl.page.next:
                animation: MOVE_left
                time: 200ms
      - script.execute: lvgl_restart_idle
