image:
  - id: boot_screen_image
    file: "https://github.com/zubrick/bathroomplayer/blob/db4727f6f514d38eeb02e374865af241903b6736/bathroomplayer.jpg"
    type: rgb565

script:
  ## WAKE UP SCREEN
  - id: wake_up_screen
    mode: restart
    then:
      - logger.log: "Running Wake Up Screen Script..."
      # ENABLE WIFI
      - if:
          condition: 
            not:
              wifi.enabled
          then:
            - wifi.enable:
      - script.execute: lvgl_restart_idle
      ## LIGHTS ON
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda 'return id(current_brightness);'

  ## RESTART LVGL IDLE TIMER
  - id: lvgl_restart_idle
    mode: restart
    then:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition: 
            not:
              wifi.enabled
          then:
            - wifi.enable:
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda 'return id(current_brightness);'
      - lambda: 'lv_disp_trig_activity(NULL);' # reset LVGL idle timer
